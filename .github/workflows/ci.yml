name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    IMAGE: us-central1-docker.pkg.dev/project-048c89b2-4501-41c9-bc3/python-tg-bot/python-tg-bot
    WORKLOAD_IDENTITY_PROVIDER: projects/547977652248/locations/global/workloadIdentityPools/github-pool/providers/github-provider
    DEPLOY_SERVICE_ACCOUNT: github-deployer@project-048c89b2-4501-41c9-bc3.iam.gserviceaccount.com
    VM_NAME: instance-20260821-030618
    VM_ZONE: us-central1-a

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 # 把觸發這次 workflow 的那個 commit 的程式碼,checkout 到 runner 的工作目錄裡

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.14'
                  cache: 'pip' # 會自動快取 pip 套件,加速下次 workflow 的 pip install

            - name: Install dependencies
              run: pip install -r requirements-dev.txt

            - name: Run tests
              run: pytest

    build-and-push:
        runs-on: ubuntu-latest
        needs: test # 先跑測試成功後再build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' # PR 只跑測試,不 build/push image
        permissions:
            contents: read
            id-token: write # 讓 google-github-actions/auth 能換取 WIF 短效憑證
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to GCP
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

            - name: Build image
              run: |
                  docker build \
                    -t "${IMAGE}:latest" \
                    -t "${IMAGE}:${{ github.sha }}" \
                    .

            - name: Push image
              run: docker push "${IMAGE}" --all-tags

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Authenticate to GCP
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Pull image and restart container on VM
              run: |
                  gcloud compute ssh "${VM_NAME}" \
                    --zone="${VM_ZONE}" \
                    --tunnel-through-iap \
                    --quiet \
                    --command="
                      sudo docker pull ${IMAGE}:${{ github.sha }} &&
                      sudo docker stop python-tg-bot || true &&
                      sudo docker rm python-tg-bot || true &&
                      sudo docker run -d --name python-tg-bot --restart unless-stopped --env-file /opt/python-tg-bot/.env ${IMAGE}:${{ github.sha }} &&
                      sudo docker image prune -f
                    "
